[project]
name = "lithe-jsonrpc"
version = "0.1.0"
description = "A FastAPI-inspired async JSON-RPC 2.0 framework with stdio & WebSocket transports"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "anyio>=4.0",
    "fast-depends>=3.0",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = [
    "websockets>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
